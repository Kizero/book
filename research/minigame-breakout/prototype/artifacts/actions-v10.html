<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="../"><title>核心动作关键帧检查</title><style>body{margin:30px;background:#e9ecd9;color:#315c4b;font:16px system-ui}main{display:flex;gap:20px}figure{margin:0;padding:18px;background:#fffcf2;border-radius:16px;text-align:center}canvas{width:230px;height:200px}small{display:block;margin:14px 0}button{padding:12px}</style><h1>核心动作关键帧检查</h1><p>使用游戏实际绘制函数。灰线为统一脚底锚点；此页是美术检查，不是游戏通关记录。</p><main id="strip"></main><script type="module">
import {Game} from './src/engine.js?v=10';import {loadAssets} from './src/assets.js?v=10';import {IllustratedArt} from './src/illustrated-art.js?v=10';
const assets=await loadAssets();for(const [name,age,sucking] of [['待机',99,0],['吸入／起手',99,1],['喷射后坐',.12,0]]){const figure=document.createElement('figure'),canvas=document.createElement('canvas');canvas.width=460;canvas.height=400;const c=canvas.getContext('2d');c.scale(2,2);c.strokeStyle='#bbc8b3';c.beginPath();c.moveTo(10,156);c.lineTo(220,156);c.stroke();const g=new Game();g.player.x=115;g.player.y=140;g.player.angle=0;g.weapon='foam';const art=new IllustratedArt(assets,g);art.action.age=age;art.action.sucking=sucking;art.player(c,g.player);figure.append(canvas);const cap=document.createElement('figcaption');cap.textContent=name;figure.append(cap);document.getElementById('strip').append(figure);}
</script></html>
