<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="../"><title>首领预告视觉检查</title><style>body{background:#e9ecd9;color:#315c4b;font:16px system-ui;margin:20px}canvas{width:960px;height:600px}</style><p>固定开发样例：检查滚桶预告、首领提示与文字布局，不是实际通关记录。</p><canvas id="scene"></canvas><script type="module">import {Game} from './src/engine.js?v=10';import {loadAssets} from './src/assets.js?v=10';import {Renderer} from './src/render.js?v=10';import {updateBoss} from './src/boss-choreography.js?v=10';const g=new Game();g.room=12;g.setupRoom();g.state='playing';for(const e of g.enemies.filter(e=>e.type==='boss'))updateBoss(g,e,.01);const r=new Renderer(document.getElementById('scene'),g,await loadAssets());function draw(){r.draw(0);requestAnimationFrame(draw)}draw();</script></html>
